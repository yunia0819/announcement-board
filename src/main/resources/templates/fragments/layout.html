<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${pageTitle} + '｜公告管理'">公告管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>

        <a class="brand" th:href="@{/announcements}" aria-label="公告管理首頁">

        <nav aria-label="主要導覽"><a class="header-link" th:href="@{/announcements}">公告列表</a></nav>
