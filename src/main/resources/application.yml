spring:
  application:
    name: announcement-board
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate.type.java_time_use_direct_jdbc: true
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  thymeleaf:
    encoding: UTF-8
server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  upload-dir: ${APP_UPLOAD_DIR:./var/uploads}
